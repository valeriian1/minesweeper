repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files

-   repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
    -   id: flake8

-   repo: local
    hooks:
    -   id: pytest
        name: Run pytest
        entry: python -m pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
